<!DOCTYPE html>
<html>
<head>
    <title>4 Cards</title>

    <style>

        body{
            background-color: lightgray;
            font-family: Arial;
        }

        .container{
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 50px;
            flex-wrap: wrap;
        }

        .card{
            width: 220px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0px 0px 10px gray;
            text-align: center;
            padding: 15px;
        }

        .card img{
            width: 100%;
            border-radius: 10px;
        }

        button{
            background-color: blue;
            color: white;
            border: none;
            padding: 10px 15px;
            margin-top: 10px;
            border-radius: 5px;
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="card">
            <img src="https://picsum.photos/200/150?1">
            <h2>Card 1</h2>
        </div>

        <div class="card">
            <img src="https://picsum.photos/200/150?2">
            <h2>Card 2</h2>
        </div>

        <div class="card">
            <img src="https://picsum.photos/200/150?3">
            <h2>Card 3</h2>
        </div>

        <div class="card">
            <img src="https://picsum.photos/200/150?4">
            <h2>Card 4</h2>
        </div>

    </div>

</body>
</html>
