<!DOCTYPE html>
<html>
<head>

<style>

body{
    height: 1500px;
}

/* Static */
.static{
    position: static;
    background: lightblue;
    padding: 20px;
    margin: 20px;
}

/* Relative */
.relative{
    position: relative;
    left: 30px;
    background: pink;
    padding: 20px;
    margin: 20px;
}

/* Absolute */
.absolute{
    position: absolute;
    top: 200px;
    right: 50px;
    background: lightgreen;
    padding: 20px;
}

/* Fixed */
.fixed{
    position: fixed;
    bottom: 10px;
    right: 10px;
    background: orange;
    padding: 20px;
}

</style>

</head>

<body>

<div class="static">
    Static Position
</div>

<div class="relative">
    Relative Position
</div>

<div class="absolute">
    Absolute Position
</div>

<div class="fixed">
    Fixed Position
</div>

</body>
</html>
